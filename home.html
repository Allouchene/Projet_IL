<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="home.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
        rel="stylesheet" />
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&icon_names=search" />
   <title>Together Play - Home</title>
</head>

<body>

    <main>
        <header>
            <div class="logo">
                <img src="images/logo.png" alt="logo" />
            </div>
            <div class="search-bar">
                <p>Rechercher</p>
                <span class="material-symbols-outlined">
                    search
                </span>
            </div>
            <div class="right-nav">
                <button>Copier le lien</button>
                <link class="settings-icon" rel="stylesheet"
                    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=settings" />
            </div>
        </header>
        <section class="video-card">
            <img src="images/youtube.jpg" alt="video thumbnail" />
        </section>
        <section class="suggestions">
            <p>suggestions</p>
            <div class="suggestions-list">
                <div class="suggestion-item">
                    <img src="images/youtube.jpg" alt="suggestion 1" />
                    <div class="info">
                        <p>Les informations de la video</p>
                        <link class="add-icon" rel="stylesheet"
                            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&icon_names=add" />
                    </div>
                </div>
                <div class="suggestion-item">
                    <img src="images/youtube.jpg" alt="suggestion 1" />
                    <div class="info">
                        <p>Les informations de la video</p>
                        <link class="add-icon" rel="stylesheet"
                            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&icon_names=add" />
                    </div>
                </div>
                <div class="suggestion-item">
                    <img src="images/youtube.jpg" alt="suggestion 1" />
                    <div class="info">
                        <p>Les informations de la video</p>
                        <link class="add-icon" rel="stylesheet"
                            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&icon_names=add" />
                    </div>
                </div>
            </div>
        </section>


    </main>
    <section class="right-section">
        <div class="card">
            <div class="title">
                <link class="playlist-icon" rel="stylesheet"
                    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=playlist_play" />
                <p>Playlist</p>
            </div>
            <div class="card-content">
                <div class="playlist-item">
                    <link class="darg-icon" rel="stylesheet"
                        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=drag_indicator" />
                    <img src="images/youtube.jpg" alt="miniature-youtube" />
                    <p>Titre de la vidéo</p>
                    <link class="close-icon" rel="stylesheet"
                        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=close_small" />
                </div>
                <div class="playlist-item">
                    <link class="darg-icon" rel="stylesheet"
                        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=drag_indicator" />
                    <img src="images/youtube.jpg" alt="miniature-youtube" />
                    <p>Titre de la vidéo</p>
                    <link class="close-icon" rel="stylesheet"
                        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=close_small" />
                </div>
                <div class="playlist-item">
                    <link class="darg-icon" rel="stylesheet"
                        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=drag_indicator" />
                    <img src="images/youtube.jpg" alt="miniature-youtube" />
                    <p>Titre de la vidéo</p>
                    <link class="close-icon" rel="stylesheet"
                        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=close_small" />
                </div>
            </div>
        </div>

        <div class="chat-box">
            <div class="title">
                <link class="chat-icon" rel="stylesheet"
                    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=chat_bubble" />
                <p>Chat</p>
            </div>
            <div class="card-content">
                <div class="message-recieved">
                    <link class="user-img" rel="stylesheet"
                        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=person" />
                    <p class="message">Bonjour tout le monde !</p>
                </div>
                <div class="message-sent">
                    <link class="user-img" rel="stylesheet"
                        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=person" />
                    <p class="message sent">Bonjour tout le monde !</p>
                </div>
                <div class="message-input">
                    <input type="text" placeholder="Écrire un message..." />
                    <link class="send-icon" rel="stylesheet"
                        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=send" />
                </div>
            </div>
        </div>

    </section>
</body>

</html>
