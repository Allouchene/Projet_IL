<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="welcome.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <title>Together Play</title>
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="images/logo.png" alt="logo" />
      </div>
      <div class="right-nav">
        <button>Créer un salon</button>
        <button>Rejoindre</button>
      </div>
    </header>
    <main>
      <h1>Regardez vos vidéos ensemble, en temps réel.</h1>
      <p>
        Créez un salon privé et invitez vos amis à regarder, discuter et
        partager vos vidéos préférées.
      </p>
      <div class="liquid-glass-card">
        <form action="POST">
          <div class="form-title">
            <a href="#">Créer un Salon</a>
            <span class="separator" aria-hidden="true"></span>
            <a href="#" class="active">Rejoindre Salon</a>
          </div>
          <input
            type="text"
            name="code-salon"
            placeholder="Entrez le code du salon"
          />
          <input
            type="text"
            name="nom-user"
            placeholder="Entrez un nom d'utilisateur"
          />
          <div class="legal-condition">
            <input type="checkbox" />
            <a href=""> Acceptez les conditions générales</a>
          </div>
          <button class="primary-button">Rejoindre le salon</button>
        </form>
      </div>
    </main>
    <footer>© 2025 Projet IL - Groupe M - Version 1.0</footer>
  </body>
</html>
